name: Lint and test

# Reusable. Syntax-checks the PHP, installs dev dependencies, and runs whichever
# test suite the repo actually has - then publishes the values the deploy step
# needs. Minifying CSS and JS is minify.yml's job, not this one's.
#
# WHY THIS IS A WORKFLOW AND NOT AN ACTION
#
# This is the half of the pipeline that must run in its own VM, and shipping it
# as a reusable workflow is what makes that structural rather than advisory.
#
# Tests execute third-party code: a Composer install pulls arbitrary packages and
# runs their scripts. Secrets are not ambient environment variables, so that code
# cannot read a deploy key directly - but a job shares one runner and one working
# directory with everything after it. Code running during dependency
# installation could tamper with public/, plant files, or poison tooling, and a
# deploy in the same job would faithfully rsync the result to a live site.
#
# A job that calls a reusable workflow CANNOT also declare `steps:` - GitHub
# rejects the file, and so does actionlint. So a consumer cannot put this and the
# deploy action in one job even by accident. If this were ever converted to a
# composite action "for symmetry" with actions/deploy, both would land in one
# job's steps and that guarantee would silently evaporate. Do not do that.
#
# It declares no `environment:`, so environment secrets are never in scope here
# at all, and `permissions:` is the minimum a checkout needs.

on:
  workflow_call:
    inputs:
      php-version:
        description: >-
          PHP version used for the lint and test steps. Leave it unset to read
          the repo's .php-version file, or 8.3 when there is none. Setting it
          alongside a .php-version that says something different fails the run.
        type: string
        default: ''
      environment:
        description: >-
          Override which environment the deploy targets. Normally derived from
          the branch; set it for a Disaster Recovery or preview target.
        type: string
        default: ''
    outputs:
      environment:
        description: >-
          The environment the deploy should target. Published here so the branch
          mapping lives in ONE place: the caller feeds it to both its
          `environment:` block and the deploy action, rather than writing the
          same ternary twice and letting the two drift.
        value: ${{ jobs.lint-and-test.outputs.environment }}
      attestation:
        description: >-
          Proof this job ran. actions/deploy requires it, which is what stops a
          consumer omitting this job: `needs.<job>.outputs.*` cannot be
          referenced unless the job exists and is listed in `needs`.
        value: ${{ jobs.lint-and-test.outputs.attestation }}

permissions:
  contents: read

env:
  # The PHP used when a repo neither passes php-version nor has a .php-version.
  # Configuration rather than logic, so it lives here: bump the default here
  # and nowhere in the steps below.
  DEFAULT_PHP_VERSION: '8.3'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      # Required: a checkout of a private repo authenticates with GITHUB_TOKEN.
      contents: read
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      attestation: ${{ steps.resolve.outputs.attestation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Resolved early, and validated here rather than at the deploy: this job
      # holds no credentials and enters no environment, so a bad value costs a
      # failed lint run instead of a failure inside a job that already has
      # production secrets in scope.
      - name: Resolve deploy environment
        id: resolve
        shell: bash
        env:
          OVERRIDE: ${{ inputs.environment }}
          BRANCH_REF: ${{ github.ref }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            # Validated HERE, in the job with no credentials, so a bad value
            # fails before the deploy job enters an environment and puts secrets
            # in scope. An environment name is a GitHub identifier: whitespace
            # in it cannot match any environment, and an all-whitespace value
            # would reach the deploy as an empty string, which is exactly the
            # input the deploy action refuses.
            case "$OVERRIDE" in
              *[[:space:]]*)
                echo "::error::environment input '${OVERRIDE}' contains whitespace."
                echo "Pass the environment's exact name, or omit the input to derive it from the branch."
                exit 1 ;;
            esac
            resolved="$OVERRIDE"
          elif [ "$BRANCH_REF" = "refs/heads/main" ]; then
            resolved="production"
          else
            resolved="staging"
          fi

          echo "environment=${resolved}" >> "$GITHUB_OUTPUT"
          echo "attestation=lint-and-test:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "Deploy environment resolved to '${resolved}'."

      # Detected, like the test suite below: a repo with a .php-version has
      # already said which PHP it runs, and setup-php reads that file itself
      # whenever it is given no version. So when the file exists this passes
      # nothing, and the file is parsed by one reader - setup-php's - not two
      # that could disagree about what it says.
      #
      # The fallback (DEFAULT_PHP_VERSION, at the top of this file) cannot simply
      # be left to setup-php. With neither an input nor a file it goes on to
      # composer.json's platform setting and then to "latest", so an
      # unconfigured repo would change PHP version the day a new one ships.
      #
      # Whitespace around the input is trimmed; whitespace inside it is refused
      # rather than removed. "8. 3" is more likely a mistyped 8.13 than an 8.3,
      # and guessing would test against a PHP nobody asked for.
      #
      # An input AND a file is two places for the truth. Agreeing is harmless;
      # disagreeing means one of them is stale, and silently picking either
      # would test against a PHP the maintainer did not expect. The comparison
      # below only guards - it never chooses what gets installed - so where its
      # reading of the file differs from setup-php's, the worst case is a loud
      # failure, not the wrong PHP.
      - name: Resolve PHP version
        id: php
        shell: bash
        env:
          REQUESTED: ${{ inputs.php-version }}
        run: |
          # Empty would hand setup-php nothing, which is the "latest" this step
          # exists to prevent - so a lost env var fails here, not silently.
          fallback="${DEFAULT_PHP_VERSION:?DEFAULT_PHP_VERSION is not set}"

          # Trim leading, then trailing, whitespace - pure bash, no subshell.
          # Not `read -r requested <<< ...`: that keeps only the first line, so
          # "8.3\n8.4" would become 8.3 and slip past the check below.
          requested="$REQUESTED"
          requested="${requested#"${requested%%[![:space:]]*}"}"
          requested="${requested%"${requested##*[![:space:]]}"}"
          case "$requested" in
            *[[:space:]]*)
              echo "::error::php-version input '${requested}' contains whitespace."
              echo "Pass a version such as 8.3 or 8.3.12, or omit the input."
              exit 1 ;;
          esac

          if [ ! -f .php-version ]; then
            version="${requested:-$fallback}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "No .php-version - using PHP ${version}."
            exit 0
          fi

          # Close to setup-php's reading - the first line that is a full X.Y.Z,
          # with an optional "php " prefix, else the whole file - but more
          # forgiving of CRLF and stray whitespace. Where they differ, setup-php
          # is the stricter one and fails on its own.
          contents="$(tr -d '\r' < .php-version)"
          from_file="$(printf '%s\n' "$contents" \
            | sed -n -E '/^(php[[:space:]])?[0-9]+\.[0-9]+\.[0-9]+$/{s/^(php[[:space:]])?//p;q;}')"
          if [ -z "$from_file" ]; then
            from_file="$(printf '%s' "$contents" | tr -d '[:space:]')"
          fi

          if [ -n "$requested" ] && [ "$requested" != "$from_file" ]; then
            echo "::error::php-version input '${requested}' disagrees with .php-version ('${from_file}')."
            echo "Remove the php-version input to use the file, or make the two match."
            exit 1
          fi

          echo "version=" >> "$GITHUB_OUTPUT"
          echo "Using .php-version (${from_file})."

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # Empty when .php-version exists, which makes setup-php read the file.
          php-version: ${{ steps.php.outputs.version }}

      - name: Syntax check all PHP files
        shell: bash
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l

      # Detected, not configured. A repo either has a Composer manifest or it
      # does not; asking the caller to declare that in an input would just be a
      # second place for the truth to live, and a second place to get it wrong.
      - name: Install development dependencies
        shell: bash
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --no-progress --no-ansi
          else
            echo "No composer.json - skipping."
          fi

      # Same principle: run whichever suite the repo actually has. A repo with
      # no tests yet is a normal state, not a failure, so say so and move on.
      #
      # Note this step goes green having run nothing when neither exists. That
      # is deliberate, but it means "the job passed" is not the same as "tests
      # ran" - read the log when it matters.
      - name: Run tests
        shell: bash
        run: |
          if [ -f tests/run.php ]; then
            php tests/run.php
          elif [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "::notice::No test suite found (looked for tests/run.php and vendor/bin/phpunit)."
          fi
