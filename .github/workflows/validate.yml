name: Validate workflows

# Lints the reusable workflows in this repository before they can reach a
# consuming site.
#
# This is the one workflow here that DOES have real triggers. lint-and-test.yml,
# minify.yml and promote.yml are `workflow_call`-only and cannot run on their
# own, and actions/deploy is not a workflow at all; this one is the reason
# pushing here does anything at all.
#
# WHY IT EXISTS
#
# A change to a shared pipeline lands on every consuming repo at once, and this
# repo cannot deploy anything by itself - so a broken commit here would first be
# discovered by a real site failing to deploy.
#
# FIVE LAYERS, ON PURPOSE
#
# 1. A structural floor (scripts/check-workflow-structure.sh): parse every
#    workflow as YAML, then syntax-check the shell embedded in each `run:`
#    block. It covers the two failure classes that have actually broken this
#    code - a file that stops parsing after an indentation slip, and a `run:`
#    block whose shell is broken and stays invisible until it executes on a
#    live deploy.
#
#    This step needs js-yaml from npm. An earlier version of this comment called
#    it self-contained and claimed it "still works if a download fails", which
#    was never true of a step whose first action is `npm install`. Layer 5 is
#    the one that genuinely needs nothing installed.
#
# 2. actionlint, which checks things nothing above can: the workflow SCHEMA
#    (unknown keys, invalid `runs-on`, bad `needs:` references), and the
#    expressions inside ${{ }} - including which contexts are legal in which
#    position. It also runs shellcheck over the `run:` blocks, handling the
#    ${{ }} substitution natively - which is why layer 4 covers only the
#    scripts that live OUTSIDE a `run:` block.
#
# 3. The README/examples drift check, because the stubs are duplicated: the
#    files under examples/ are what a consumer copies, and the README shows the
#    same text inline. Nothing but this step stops the two from disagreeing,
#    and a stale README stub is worse than none - it gets copied.
#
# 4. shellcheck over the standalone *.sh scripts, including the deploy action's
#    steps in actions/deploy/scripts/. actionlint never sees them; they are
#    not `run:` blocks. This is a real gap rather than a theoretical
#    one - see the step itself.
#
#    Layer 2 also cannot see actions/*/action.yml at all, so a separate check
#    rejects GitHub expressions in action METADATA - descriptions are evaluated
#    at load time against a context set that excludes vars, and one that
#    mentioned an expression took every consumer down before a step ran. It
#    parses the YAML, so it needs js-yaml the same way layer 1 does.
#
# 5. The test suite in tests/, which runs the deploy action's scripts as the
#    action does. Layers 1 to 4 all ask whether the code is well-formed; this one
#    asks whether it does the right thing. Every defect that has reached a
#    consuming site was well-formed shell that behaved wrongly - a guard above
#    the gate meant to skip it, two sides of a comparison normalized
#    differently, a refusal downgraded to a warning - and none of the layers
#    above can see any of that. It needs only bash, awk and git.
#
# WHAT IT CANNOT DO
#
# It cannot test a DEPLOY. The tests above cover the validation logic, but there
# is no host here and no credentials, by design, so nothing exercises rsync, ssh
# or the server-side layout. The real integration test is to point one consuming
# repo's stub at a branch of this repo and push to its `staging` - see the
# Releasing section of MAINTAINING.md.

# No `paths:` filter, deliberately.
#
# There was one, listing .github/workflows, examples, scripts and README.md.
# Every file it left out turned out to be a file that changes what these checks
# DO: .devcontainer/setup.sh (the script layer 4 exists for, so a commit fixing
# it ran nothing), .actionlint-version (a transposed checksum would surface
# later, on an unrelated edit, as a bare sha256sum failure), and
# .github/actionlint.yaml, which sits beside the workflows directory rather than
# inside it and so was never matched.
#
# A curated list is a second place for the truth to live, and it drifts silently
# - the failure mode is a green commit that was never checked. What the filter
# actually excluded was LICENSE and .gitignore. That is not worth the risk, so
# everything runs on every push.
on:
  push:
  pull_request:

# Nothing here needs to write, and this repo holds no secrets. Fork pull
# requests are therefore uninteresting to an attacker, but keep the token
# minimal regardless. `contents: read` is required: checkout authenticates with
# it.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # js-yaml, for the two checks that parse YAML: layer 1 below and the
      # action-metadata check. Pinned to an exact version, the same way
      # minify.yml pins esbuild. Node is preinstalled on the runner; a YAML
      # parser is not.
      #
      # Installed rather than resolved out of an npx cache: one predictable
      # path, no branch that behaves differently depending on what the runner
      # image happens to have warmed.
      - name: Install js-yaml
        shell: bash
        run: npm install --no-save --silent js-yaml@4.1.0

      # Layer 1. Every workflow, example and composite action parses as YAML,
      # every composite action follows the rules actionlint cannot check, and
      # every `run:` block parses as bash. The script's header says what and
      # why; the VS Code "Check workflow structure" task runs the same file.
      - name: Check workflow structure
        shell: bash
        run: bash scripts/check-workflow-structure.sh

      # scripts/install-actionlint.sh downloads the release pinned in
      # .actionlint-version and verifies it against the committed checksum
      # before extracting anything. The dev container installs through the same
      # script, so local checks and CI cannot end up on different versions.
      - name: Install actionlint
        shell: bash
        run: bash scripts/install-actionlint.sh /tmp

      # actionlint finds .github/workflows itself. shellcheck is preinstalled on
      # the runner image, and actionlint invokes it on `run:` blocks when present.
      #
      # examples/workflows/ has to be named explicitly: actionlint only scans
      # the conventional workflow directory, and these deliberately live outside
      # it.
      # They must not sit in .github/workflows here - they carry real triggers,
      # so GitHub would run them in THIS repo, where they have no secrets and no
      # site to deploy to.
      #
      # A broken example is worse than no example, because it gets copied.
      #
      # scripts/lint-workflows.sh decides what gets linted, and both this step
      # and the VS Code task call it so they cannot disagree. It lints
      # examples/workflows/ and skips examples/dependabot.yml, which is
      # configuration rather than a workflow and which actionlint rejects
      # outright. That file is YAML-parsed by layer 1 above instead, so it is
      # not left with no syntax coverage at all.
      #
      # Known limit: actionlint cannot resolve `uses: Apeify/ci/...@ref` against
      # a remote repository, so it checks the examples' schema and syntax but
      # not whether their `with:` keys match this workflow's declared inputs.
      - name: Run actionlint
        shell: bash
        env:
          ACTIONLINT: /tmp/actionlint
        run: bash scripts/lint-workflows.sh

      # The README reproduces each example inline so it can be read without
      # navigating away. That duplication would drift - this repo has already
      # produced several cases of documentation quietly disagreeing with
      # behavior - so the two are compared mechanically instead of trusted.
      #
      # Each block is delimited in README.md by an HTML comment naming the file
      # it mirrors, by repo-relative path:
      # `<!-- example:examples/workflows/deploy.yml -->`, immediately before the
      # fence.
      # HTML comments are invisible when rendered, and an explicit marker is far
      # more robust than inferring the block from a nearby heading.
      #
      # The examples are the source of truth. If this fails, regenerate the
      # README block from the file, not the other way around.
      # Extracted to a script because BOTH this workflow and the local VS Code
      # task run it. Inlining it here and copying it into tasks.json would
      # reintroduce the exact class of drift the check exists to prevent, one
      # level up.
      # Invoked via `bash` rather than executed directly, deliberately. This repo
      # is edited on Windows, where git has core.fileMode=false and records new
      # files as 100644 - so the exec bit does not survive into the checkout and
      # `run: scripts/foo.sh` would fail with "Permission denied" on the runner.
      # Calling bash explicitly is mode-independent and cannot regress.
      - name: Check README matches examples/
        shell: bash
        run: bash scripts/check-readme-examples.sh

      # actionlint only sees shell that lives inside a workflow `run:` block.
      # Standalone scripts - .devcontainer/setup.sh, scripts/ and tests/ - are
      # invisible to it, so without this step nothing automated checks them.
      #
      # That gap is not hypothetical: a broken shellcheck directive in setup.sh
      # was found only by running the equivalent VS Code task by hand. This is
      # the same invocation that task uses, so local and CI agree.
      #
      #   -x                       follow sourced files, so a `source=`
      #                            directive is resolved rather than reported
      #                            as SC1091
      #   --source-path=SCRIPTDIR  resolve those directives relative to the
      #                            SCRIPT, not the working directory
      #
      # Discovered with `git ls-files` so a new script is covered automatically
      # and node_modules/ is never walked.
      - name: Shellcheck standalone shell scripts
        shell: bash
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' | sort)

          if [ ${#scripts[@]} -eq 0 ]; then
            echo "::warning::No tracked *.sh files found - is that expected?"
            exit 0
          fi

          printf 'checking: %s\n' "${scripts[@]}"
          shellcheck -x --source-path=SCRIPTDIR "${scripts[@]}"

      # Catches a class nothing else can see: actionlint cannot read composite
      # actions at all, layer 1 above only checks structure, and a
      # description containing an expression is perfectly valid YAML. An action
      # shipped with an expression in an input description and every consumer
      # failed to LOAD it, before a step ran.
      #
      # It needs js-yaml, which the Install js-yaml step installed - so it cannot
      # run before that, and an earlier version of this comment claiming it beat
      # the downloads was wrong in the same way the layer-1 comment at the top
      # records being wrong.
      - name: Check action metadata for expressions
        shell: bash
        run: bash scripts/check-action-metadata.sh

      # The only layer that tests BEHAVIOR rather than form, and the only one
      # that needs nothing installed - bash, awk and git are all on the runner
      # already. It is last because the layers above give better messages for
      # the failures they catch: a YAML slip reported as "no run: body found for
      # step X" would send a reader hunting in the wrong place.
      #
      # The suite runs the deploy action's own scripts rather than restating
      # them, so it cannot pass while the action is broken. See
      # tests/run.sh.
      - name: Run the test suite
        shell: bash
        run: bash tests/run.sh
